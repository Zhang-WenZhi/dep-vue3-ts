<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>匆匆那年 - 吉他谱</title>
  <!-- 引入Tailwind CSS (国内镜像) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入Font Awesome (字节跳动镜像) -->
  <link href="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <!-- 引入React和ReactDOM (阿里云镜像) -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
  <!-- 引入Babel用于JSX转换 (阿里云镜像) -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.2/babel.min.js"></script>
  <!-- 引入VexFlow (jsDelivr国内加速) -->
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.4/build/cjs/vexflow-min.js"></script>
  
  <!-- 配置Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#8B5A2B',     // 吉他木色
            secondary: '#D2B48C',   // 浅木色
            accent: '#CD853F',      // 突出色
            dark: '#3E2723',        // 深色文字
            light: '#F5F5DC',       // 浅色背景
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Georgia', 'serif'],
          },
        },
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .text-shadow {
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
      }
      .chord-highlight {
        transition: all 0.3s ease;
      }
      .chord-highlight:hover {
        transform: scale(1.1);
        background-color: rgba(210, 180, 140, 0.3);
      }
    }
  </style>
</head>
<body class="bg-light min-h-screen text-dark font-sans">
  <div id="root" class="max-w-5xl mx-auto px-4 py-8"></div>

  <script type="text/babel">
    // 和弦数据
    const chordData = {
      'C': {
        fingers: [
          { string: 2, fret: 1, finger: 1 },
          { string: 4, fret: 2, finger: 2 },
          { string: 5, fret: 3, finger: 3 }
        ],
        baseFret: 0
      },
      'G': {
        fingers: [
          { string: 1, fret: 3, finger: 3 },
          { string: 2, fret: 3, finger: 4 },
          { string: 6, fret: 3, finger: 2 },
          { string: 5, fret: 2, finger: 1 }
        ],
        baseFret: 0
      },
      'Am': {
        fingers: [
          { string: 2, fret: 1, finger: 1 },
          { string: 3, fret: 2, finger: 2 }
        ],
        baseFret: 0
      },
      'F': {
        fingers: [
          { string: 1, fret: 1, finger: 1 },
          { string: 2, fret: 2, finger: 2 },
          { string: 3, fret: 3, finger: 3 }
        ],
        baseFret: 1,
        barres: [1]
      }
    };

    // 歌词与和弦数据
    const lyricsData = [
      { chord: 'C', text: '匆匆那年我们究竟说了几遍 再见' },
      { chord: 'G', text: '再见之后再拖延' },
      { chord: 'Am', text: '可惜谁有没有 爱过不是一场 七情上面的雄辩' },
      { chord: 'F', text: '匆匆那年我们一时匆忙撂下 难以承受的诺言' },
      { chord: 'C', text: '只有等别人兑现' },
      { chord: 'G', text: '不怪那吻痕还 没积累成茧' },
      { chord: 'Am', text: '拥抱着冬眠也没能 羽化再成仙' },
      { chord: 'F', text: '不怪这一段情 没空反复再排练' },
      { chord: 'C', text: '是岁月宽容恩赐 反悔的时间' }
    ];

    // 和弦图表组件
    const ChordDiagram = ({ chordName }) => {
      const diagramRef = React.useRef(null);
      
      React.useEffect(() => {
        if (!diagramRef.current || !chordData[chordName]) return;
        
        const chord = chordData[chordName];
        const el = diagramRef.current;
        el.innerHTML = ''; // 清空现有内容
        
        // 创建SVG元素
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('width', '100');
        svg.setAttribute('height', '100');
        svg.setAttribute('viewBox', '0 0 100 100');
        
        // 绘制指板
        const board = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        board.setAttribute('x', '10');
        board.setAttribute('y', '10');
        board.setAttribute('width', '80');
        board.setAttribute('height', '80');
        board.setAttribute('fill', '#f5f0e0');
        board.setAttribute('stroke', '#8B5A2B');
        board.setAttribute('stroke-width', '2');
        svg.appendChild(board);
        
        // 绘制品位线
        const numFrets = 4;
        for (let i = 0; i <= numFrets; i++) {
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          const y = 10 + (80 / numFrets) * i;
          line.setAttribute('x1', '10');
          line.setAttribute('y1', y);
          line.setAttribute('x2', '90');
          line.setAttribute('y2', y);
          line.setAttribute('stroke', '#8B5A2B');
          line.setAttribute('stroke-width', i === 0 ? 4 : 2);
          svg.appendChild(line);
        }
        
        // 绘制琴弦
        for (let i = 0; i < 6; i++) {
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          const x = 20 + (15 * i);
          line.setAttribute('x1', x);
          line.setAttribute('y1', '10');
          line.setAttribute('x2', x);
          line.setAttribute('y2', '90');
          line.setAttribute('stroke', '#333');
          line.setAttribute('stroke-width', 1);
          svg.appendChild(line);
        }
        
        // 绘制品位标记和手指位置（省略部分重复代码，保持与之前版本一致）
        if (chord.baseFret > 0) {
          const fretLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          fretLabel.setAttribute('x', '50');
          fretLabel.setAttribute('y', '15');
          fretLabel.setAttribute('text-anchor', 'middle');
          fretLabel.setAttribute('font-size', '12');
          fretLabel.setAttribute('fill', '#333');
          fretLabel.textContent = `第${chord.baseFret}品`;
          svg.appendChild(fretLabel);
        }
        
        if (chord.barres && chord.barres.length > 0) {
          chord.barres.forEach(fret => {
            const barre = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            const adjustedFret = fret - chord.baseFret;
            const y = 10 + (80 / numFrets) * adjustedFret + 5;
            barre.setAttribute('x', '15');
            barre.setAttribute('y', y);
            barre.setAttribute('width', '70');
            barre.setAttribute('height', '10');
            barre.setAttribute('rx', '5');
            barre.setAttribute('fill', '#CD853F');
            barre.setAttribute('stroke', '#8B5A2B');
            barre.setAttribute('stroke-width', '1');
            svg.appendChild(barre);
          });
        }
        
        chord.fingers.forEach(note => {
          if (note.fret === 0) return;
          
          const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          const stringIndex = 6 - note.string;
          const adjustedFret = note.fret - chord.baseFret;
          
          const x = 20 + (15 * stringIndex);
          const y = 10 + (80 / numFrets) * adjustedFret + 10;
          
          dot.setAttribute('cx', x);
          dot.setAttribute('cy', y);
          dot.setAttribute('r', '6');
          dot.setAttribute('fill', '#8B5A2B');
          
          const fingerText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          fingerText.setAttribute('x', x);
          fingerText.setAttribute('y', y + 4);
          fingerText.setAttribute('text-anchor', 'middle');
          fingerText.setAttribute('font-size', '10');
          fingerText.setAttribute('fill', 'white');
          fingerText.textContent = note.finger;
          
          svg.appendChild(dot);
          svg.appendChild(fingerText);
        });
        
        el.appendChild(svg);
      }, [chordName]);
      
      return <div ref={diagramRef} className="chord-diagram mx-auto"></div>;
    };

    // 六线谱组件
    const Tablature = () => {
      const tabRef = React.useRef(null);
      
      React.useEffect(() => {
        if (!tabRef.current) return;
        
        const { Vex } = window;
        const { Renderer, Beam, TabNote, TabStave } = Vex.Flow;
        
        // 创建渲染器
        const div = tabRef.current;
        const renderer = new Renderer(div, Renderer.Backends.SVG);
        
        // 设置尺寸
        renderer.resize(1200, 300);
        const context = renderer.getContext();
        
        // 创建六线谱
        const tabStave = new TabStave(10, 40, 1100);
        tabStave.addClef('treble');
        tabStave.setContext(context).draw();
        
        // 定义音符 - 匆匆那年片段
        const notes = [
          // 第一小节 C和弦
          new TabNote({ positions: [{ line: 5 }, { line: 3 }, { line: 2 }, { line: 0 }], duration: '8', stroke: 'up' }),
          new TabNote({ positions: [{ line: 5 }, { line: 3 }, { line: 2 }, { line: 0 }], duration: '8', stroke: 'down' }),
          new TabNote({ positions: [{ line: 5 }, { line: 3 }, { line: 2 }, { line: 0 }], duration: '4', stroke: 'up' }),
          
          // 第二小节 C和弦
          new TabNote({ positions: [{ line: 5 }, { line: 3 }, { line: 2 }, { line: 0 }], duration: '8', stroke: 'down' }),
          new TabNote({ positions: [{ line: 5 }, { line: 3 }, { line: 2 }, { line: 0 }], duration: '8', stroke: 'up' }),
          new TabNote({ positions: [{ line: 5 }, { line: 3 }, { line: 2 }, { line: 0 }], duration: '4', stroke: 'down' }),
          
          // 第三小节 G和弦
          new TabNote({ positions: [{ line: 4 }, { line: 3 }, { line: 2 }, { line: 1 }], duration: '8', stroke: 'up' }),
          new TabNote({ positions: [{ line: 4 }, { line: 3 }, { line: 2 }, { line: 1 }], duration: '8', stroke: 'down' }),
          new TabNote({ positions: [{ line: 4 }, { line: 3 }, { line: 2 }, { line: 1 }], duration: '4', stroke: 'up' }),
          
          // 第四小节 Am和弦
          new TabNote({ positions: [{ line: 5 }, { line: 3 }, { line: 2 }], duration: '8', stroke: 'down' }),
          new TabNote({ positions: [{ line: 5 }, { line: 3 }, { line: 2 }], duration: '8', stroke: 'up' }),
          new TabNote({ positions: [{ line: 5 }, { line: 3 }, { line: 2 }], duration: '4', stroke: 'down' })
        ];
        
        // 绘制音符
        const voice = new Vex.Flow.Voice({
          num_beats: 4,
          beat_value: 4,
          resolution: Vex.Flow.RESOLUTION
        });
        
        voice.addTickables(notes);
        const beams = Beam.generateBeams(notes);
        new Vex.Flow.Formatter().joinVoices([voice]).format([voice], 1000);
        voice.draw(context, tabStave);
        beams.forEach(beam => beam.setContext(context).draw());
        
        // 添加和弦标记
        const chordPositions = [50, 350, 650, 950];
        const chordNames = ['C', 'C', 'G', 'Am'];
        
        chordNames.forEach((name, i) => {
          context.save();
          context.setFont('Arial', 16, 'bold');
          context.fillStyle = '#8B5A2B';
          context.fillText(name, chordPositions[i], 30);
          context.restore();
        });
      }, []);
      
      return (
        <div ref={tabRef} className="w-full overflow-x-auto bg-white p-4 rounded-lg shadow-md"></div>
      );
    };

    // 主应用组件
    const App = () => {
      const [isPlaying, setIsPlaying] = React.useState(false);
      const [playbackSpeed, setPlaybackSpeed] = React.useState(1.0);
      const chords = ['C', 'G', 'Am', 'F'];
      
      // 播放/暂停控制
      const playPause = () => {
        setIsPlaying(!isPlaying);
        if (!isPlaying) {
          console.log('开始播放，速度:', playbackSpeed);
        } else {
          console.log('停止播放');
        }
      };
      
      // 调整播放速度
      const speedUp = () => {
        setPlaybackSpeed(prev => Math.min(prev + 0.1, 2.0));
      };
      
      const speedDown = () => {
        setPlaybackSpeed(prev => Math.max(prev - 0.1, 0.5));
      };
      
      // 全屏切换
      const toggleFullscreen = () => {
        const docEl = document.documentElement;
        if (!document.fullscreenElement) {
          docEl.requestFullscreen().catch(err => {
            console.error(`全屏请求错误: ${err.message}`);
          });
        } else {
          document.exitFullscreen();
        }
      };
      
      return (
        <div className="max-w-5xl mx-auto px-4 py-8">
          {/* 页面标题区域 */}
          <header className="text-center mb-10">
            <h1 className="text-[clamp(2rem,5vw,3.5rem)] font-bold text-primary mb-2 text-shadow">匆匆那年</h1>
            <p className="text-gray-600 text-lg">王菲 / 吉他谱</p>
            <div className="flex justify-center items-center mt-4 space-x-2 text-sm text-gray-500">
              <span className="px-3 py-1 bg-secondary/30 rounded-full">C调</span>
              <span className="px-3 py-1 bg-secondary/30 rounded-full">拍号 4/4</span>
              <span className="px-3 py-1 bg-secondary/30 rounded-full">难度 中等</span>
            </div>
          </header>
          
          {/* 控制区域 */}
          <div className="flex flex-wrap justify-center gap-4 mb-8 p-4 bg-white/50 rounded-lg shadow-md">
            <button 
              onClick={playPause} 
              className="flex items-center gap-2 px-6 py-2 bg-primary text-white rounded-full hover:bg-primary/80 transition-all"
            >
              <i className={`fa ${isPlaying ? 'fa-pause' : 'fa-play'}`}></i>
              <span>{isPlaying ? '暂停' : '播放'}</span>
            </button>
            <button onClick={speedDown} className="p-2 bg-white rounded-full hover:bg-gray-100 transition-all">
              <i className="fa fa-minus"></i>
            </button>
            <span className="flex items-center px-3 py-1 bg-white rounded-full">
              速度: {playbackSpeed.toFixed(1)}x
            </span>
            <button onClick={speedUp} className="p-2 bg-white rounded-full hover:bg-gray-100 transition-all">
              <i className="fa fa-plus"></i>
            </button>
            <button onClick={toggleFullscreen} className="ml-4 px-4 py-2 bg-secondary/70 rounded-full hover:bg-secondary transition-all">
              <i className="fa fa-expand mr-1"></i> 全屏
            </button>
          </div>
          
          {/* 和弦图表区域 */}
          <section className="mb-10">
            <h2 className="text-xl font-semibold mb-4 text-primary border-b border-secondary pb-2">和弦图表</h2>
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
              {chords.map(chord => (
                <div key={chord} className="chord-highlight p-3 bg-white rounded-lg shadow-sm text-center">
                  <h3 className="font-bold text-lg mb-2">{chord}</h3>
                  <ChordDiagram chordName={chord} />
                </div>
              ))}
            </div>
          </section>
          
          {/* 歌词与和弦区域 */}
          <section className="mb-12 bg-white rounded-xl shadow-md p-6">
            <h2 className="text-xl font-semibold mb-6 text-primary border-b border-secondary pb-2">歌词与和弦</h2>
            <div className="text-lg leading-loose space-y-4">
              {lyricsData.map((item, index) => (
                <p key={index} className="flex flex-wrap">
                  <span className="mr-2 font-bold text-accent">[{item.chord}]</span>
                  <span>{item.text}</span>
                </p>
              ))}
            </div>
          </section>
          
          {/* 六线谱区域 */}
          <section className="mb-10">
            <h2 className="text-xl font-semibold mb-4 text-primary border-b border-secondary pb-2">六线谱</h2>
            <Tablature />
          </section>
          
          {/* 页脚 */}
          <footer className="text-center text-gray-500 text-sm py-6">
            <p>© 2023 吉他谱展示 | 使用React和VexFlow构建</p>
          </footer>
        </div>
      );
    };

    // 渲染应用
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
